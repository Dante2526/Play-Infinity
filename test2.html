<!DOCTYPE html>
<html lang="pt-br">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="theme-color" content="#0a0a0f">
    <title>Verificação</title>

    <style>
        :root{
            color-scheme:dark;
            --bg:#0a0a0f99;
            --surface:rgba(18,18,24,.72);
            --border:rgba(255,255,255,.08);
            --text:#e4e4e7;
            --muted:#9a9aa0;
            --danger:#fca5a5;
            --radius:20px;
            --transition:.2s ease;
        }
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        html,body{width:100%;height:100%;margin:0}
        body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:16px;position:relative}
        .bg-image{position:fixed;inset:-36px;z-index:0;background-position:center;background-size:cover;background-repeat:no-repeat;filter:blur(15px) brightness(.4);transform:scale(1.02);pointer-events:none;opacity:.86}
        #pattern{position:fixed;top:-44px;left:-50px;right:0;bottom:0;z-index:1;pointer-events:none;overflow:hidden}
        #pattern div{opacity:0;transition:none}
        .captcha-shell{position:relative;z-index:2;width:min(400px,calc(100vw - 32px));background:var(--surface);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px 24px;box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.05) inset;display:flex;flex-direction:column;gap:20px;transition:border-color var(--transition)}
        .captcha-shell:hover{border-color:rgba(255,255,255,.14)}
        .shell-top{display:flex;align-items:center;gap:14px}
        .brand-orb{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);flex-shrink:0}
        .brand-orb svg{width:22px;height:22px;stroke:#e4e4e7;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .title-group{min-width:0}
        .captcha-title{margin:0;font-size:17px;font-weight:600;letter-spacing:-.3px;color:#f4f4f5;line-height:1.2}
        .captcha-subtitle{margin:4px 0 0;font-size:13px;color:var(--muted);font-weight:400;line-height:1.4}
        .captcha-box{position:relative;display:flex;align-items:center;justify-content:center;min-height:90px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.06);border-radius:16px;overflow:hidden;transition:border-color var(--transition)}
        .captcha-box:focus-within{border-color:rgba(255,255,255,.2)}
        .status-row{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;color:var(--muted);min-height:24px}
        .status-dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:#e4e4e7;animation:spin 1s linear infinite;display:inline-block;flex-shrink:0}
        @keyframes spin{to{transform:rotate(360deg)}}
        .captcha-status{font-weight:500;transition:color .2s}
        .captcha-error{color:var(--danger)}
        .captcha-retry{display:none;width:100%;padding:12px 16px;background:transparent;border:1px solid rgba(255,255,255,.15);color:#e4e4e7;font-size:13px;font-weight:500;border-radius:14px;cursor:pointer;transition:background var(--transition),border-color var(--transition),transform var(--transition);text-align:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
        .captcha-retry.show{display:block}
        .captcha-retry:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.25);transform:translateY(-1px)}
        .captcha-retry:active{transform:translateY(0)}
        .safe-note{display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;color:rgba(255,255,255,.4);font-weight:500;letter-spacing:.2px}
        .safe-note span{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.25)}
        .config{position:relative;z-index:2;width:min(400px,calc(100vw - 32px));background:var(--surface);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(252,165,165,.24);border-radius:var(--radius);padding:24px;color:#fecaca;font-size:13px;line-height:1.45;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
        @media(max-width:360px){.captcha-shell{padding:20px 16px;border-radius:18px}.captcha-title{font-size:15px}.captcha-box{transform:scale(.96);transform-origin:center}}
        @media(max-width:320px){.captcha-box{transform:scale(.9)}}
    </style>
</head>
<body>
            <div class="bg-image" style="background-image:url('https://d1muf25xaso8hp.cloudfront.net/https://image.tmdb.org/t/p/w1280/7RyHsO4yDXtBv1zUU3mTpHeQ0d5.jpg')"></div>
        <div id="pattern"></div>

            <form method="GET" action="https://superflixapi.cyou/filme/299534" id="cf-turnstile-form" class="captcha-shell" autocomplete="off">
                        <input type="hidden" name="cf_embed_hash" id="cf_embed_hash" value="">
            <input type="hidden" name="cf_embed_referrer" id="cf_embed_referrer" value="">
            <input type="hidden" name="cf_embed_referrer_host" id="cf_embed_referrer_host" value="">
            <input type="hidden" name="cf_client_mobile" id="cf_client_mobile" value="">

            <div class="shell-top">
                <div class="brand-orb" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 3l7 4v5c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V7l7-4z"></path>
                        <path d="M9.5 12.2l1.7 1.7 3.6-4"></path>
                    </svg>
                </div>
                <div class="title-group">
                    <h1 class="captcha-title">Validação segura</h1>
                    <p class="captcha-subtitle">Confirme que você é humano para continuar.</p>
                </div>
            </div>

            <div class="captcha-box">
                <div id="cf-turnstile-widget" class="cf-turnstile-placeholder"></div>
            </div>

            <div class="status-row">
                <span class="status-dot"></span>
                <div id="captchaStatus" class="captcha-status ">
                    Aguardando verificação...
                </div>
            </div>

            <button type="button" id="captchaRetry" class="captcha-retry ">Tentar novamente</button>

            <div class="safe-note">
                <span></span>
                Protegido por Cloudflare
                <span></span>
            </div>
        </form>

        <script>
            (function(){
                const form = document.getElementById('cf-turnstile-form');
                const status = document.getElementById('captchaStatus');
                const retry = document.getElementById('captchaRetry');
                const hashInput = document.getElementById('cf_embed_hash');
                const refInput = document.getElementById('cf_embed_referrer');
                const refHostInput = document.getElementById('cf_embed_referrer_host');
                const mobileInput = document.getElementById('cf_client_mobile');
                const initialHash = "";
                const initialReferrer = "";
                const initialReferrerHost = "";
                const turnstileSiteKey = "0x4AAAAAADPYY402lAOerPYC";
                const captchaDelaySeconds = Math.max(0, Math.min(3600, parseInt(0, 10) || 0));
                const widgetBox = document.getElementById('cf-turnstile-widget');
                let submitted = false;
                let captchaLoaded = false;
                let captchaRenderStarted = false;

                function isMobileOrStandalone(){
                    try{
                        return /Android|iPhone|iPad|iPod|Mobile|wv/i.test(navigator.userAgent || '')
                            || (window.matchMedia && (window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches))
                            || window.navigator.standalone === true;
                    }catch(e){return false;}
                }

                function cleanRefUrl(value){
                    value = String(value || '').trim();
                    if(!value || value === 'null' || value === 'undefined' || value === 'about:blank') return '';
                    return value.replace(/[?#].*$/, '');
                }

                function refHost(value){
                    value = String(value || '').trim().toLowerCase();
                    if(!value) return '';
                    try{ if(value.indexOf('://') !== -1) value = new URL(value).hostname || ''; }catch(e){}
                    return value.replace(/^www\./, '').split('/')[0].split(':')[0];
                }

                function ancestorOrigin(){
                    try{return (window.location.ancestorOrigins && window.location.ancestorOrigins.length) ? String(window.location.ancestorOrigins[0] || '') : '';}catch(e){return '';}
                }

                function syncEmbedHash(){
                    if(!hashInput) return;
                    const currentHash = (window.location.hash || '').replace(/^#/, '');
                    hashInput.value = currentHash || initialHash || hashInput.value || '';
                }

                function syncEmbedReferrer(){
                    const currentRef = cleanRefUrl(refInput && refInput.value ? refInput.value : '');
                    const detectedRef = cleanRefUrl(document.referrer || ancestorOrigin() || initialReferrer || '');
                    const finalRef = currentRef || detectedRef;
                    if(refInput) refInput.value = finalRef;
                    if(refHostInput){
                        const currentHost = refHost(refHostInput.value || '');
                        refHostInput.value = currentHost || initialReferrerHost || refHost(finalRef);
                    }
                }

                function syncClientMode(){
                    if(mobileInput && isMobileOrStandalone()) mobileInput.value = '1';
                }

                function showRetry(message){
                    submitted = false;
                    if(status){
                        status.classList.add('captcha-error');
                        status.textContent = message || 'Não foi possível validar. Tente novamente.';
                    }
                    if(retry) retry.classList.add('show');
                }

                if(!window.location.hash && initialHash){
                    try{history.replaceState(null, '', window.location.pathname + window.location.search + '#' + initialHash);}catch(e){}
                }

                syncEmbedHash();
                syncEmbedReferrer();
                syncClientMode();
                window.addEventListener('hashchange', syncEmbedHash);
                if(retry) retry.addEventListener('click', function(){window.location.reload();});

                function loadTurnstile(){
                    if(captchaLoaded) return;
                    captchaLoaded = true;
                    if(status){
                        status.classList.remove('captcha-error');
                        status.textContent = 'Aguardando verificação...';
                    }
                    const script = document.createElement('script');
                    script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
                    script.async = true;
                    script.defer = true;
                    script.crossOrigin = 'anonymous';
                    script.onload = renderTurnstile;
                    script.onerror = function(){showRetry('Não foi possível carregar a verificação. Tente novamente.');};
                    document.head.appendChild(script);
                }

                function renderTurnstile(){
                    if(captchaRenderStarted || !widgetBox || !window.turnstile || !turnstileSiteKey) return;
                    captchaRenderStarted = true;
                    try{
                        window.turnstile.render(widgetBox, {
                            sitekey: turnstileSiteKey,
                            theme: 'dark',
                            retry: 'auto',
                            'retry-interval': 4000,
                            'refresh-expired': 'auto',
                            callback: window.cloudflareEmbedCaptchaPassed,
                            'error-callback': window.cloudflareEmbedCaptchaError,
                            'expired-callback': window.cloudflareEmbedCaptchaExpired
                        });
                    }catch(e){
                        captchaRenderStarted = false;
                        showRetry('Não foi possível iniciar a verificação. Tente novamente.');
                    }
                }

                function startCaptchaDelay(){
                    if(captchaDelaySeconds <= 0){ loadTurnstile(); return; }
                    let remaining = captchaDelaySeconds;
                    if(status) status.textContent = 'A verificação será exibida em ' + remaining + 's...';
                    const timer = setInterval(function(){
                        remaining -= 1;
                        if(remaining > 0){
                            if(status) status.textContent = 'A verificação será exibida em ' + remaining + 's...';
                            return;
                        }
                        clearInterval(timer);
                        loadTurnstile();
                    }, 1000);
                }

                window.cloudflareEmbedCaptchaPassed = function(token){
                    if(submitted || !form || !token) return;
                    submitted = true;
                    if(status){
                        status.classList.remove('captcha-error');
                        status.textContent = 'Validação concluída. Redirecionando...';
                    }
                    if(retry) retry.classList.remove('show');
                    syncEmbedHash();
                    syncEmbedReferrer();
                    syncClientMode();
                    const input = form.querySelector('input[name="cf-turnstile-response"]') || document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'cf-turnstile-response';
                    input.value = token;
                    if(!input.parentNode) form.appendChild(input);
                    form.submit();
                };

                window.cloudflareEmbedCaptchaError = function(){showRetry('Não foi possível carregar a verificação. Tente novamente.');};
                window.cloudflareEmbedCaptchaExpired = function(){showRetry('Verificação expirada. Tente novamente.');};

                startCaptchaDelay();

                setTimeout(function(){
                    if(submitted || !captchaLoaded) return;
                    const hasTurnstile = !!document.querySelector('.cf-turnstile iframe, iframe[src*="challenges.cloudflare.com"]');
                    if(!hasTurnstile) showRetry('Não foi possível carregar a verificação. Tente novamente.');
                }, (captchaDelaySeconds * 1000) + 12000);

                const pattern = document.getElementById('pattern');
                const hexagons = [];
                const lightRadius = 185;
                let mouseX = -1000;
                let mouseY = -1000;

                function createHexagons(){
                    if(!pattern) return;
                    pattern.innerHTML = '';
                    hexagons.length = 0;
                    const countY = Math.ceil(window.innerHeight / 40) + 2;
                    const countX = Math.ceil(window.innerWidth / 48) + 2;
                    for(let i = 0; i < countY; i++){
                        for(let j = 0; j < countX; j++){
                            const hex = document.createElement('div');
                            const left = j * 48 + ((i * 24) % 48);
                            const top = i * 40;
                            hex.style.cssText = "background:url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODciIGhlaWdodD0iMTAwIiB2aWV3Qm94PSIwIDAgODcgMTAwIiBmaWxsPSJub25lIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPgo8cGF0aCBkPSJNMi4xOTg3MyAyNi4xNTQ3TDQzLjUgMi4zMDk0TDg0LjgwMTMgMjYuMTU0N1Y3My44NDUzTDQzLjUgOTcuNjkwNkwyLjE5ODczIDczLjg0NTNWMjYuMTU0N1oiIGZpbGw9IiMxYTFhMjAiIHN0cm9rZT0iIzFhMWEyMCIgc3Ryb2tlLXdpZHRoPSI0Ii8+Cjwvc3ZnPgo=') no-repeat;width:44px;height:50px;background-size:contain;position:absolute;top:" + top + "px;left:" + left + "px;opacity:0;";
                            pattern.appendChild(hex);
                            hexagons.push({element:hex,centerX:left + 22,centerY:top + 25});
                        }
                    }
                }

                function illuminate(){
                    for(let i = 0; i < hexagons.length; i++){
                        const h = hexagons[i];
                        const dx = h.centerX - mouseX;
                        const dy = h.centerY - mouseY;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        let opacity = 0;
                        if(distance < lightRadius){
                            opacity = .95 * (1 - distance / lightRadius);
                            opacity = Math.pow(opacity, 1.18);
                        }
                        h.element.style.opacity = opacity;
                    }
                    requestAnimationFrame(illuminate);
                }

                createHexagons();
                window.addEventListener('resize', createHexagons);
                document.addEventListener('mousemove', function(e){mouseX = e.clientX; mouseY = e.clientY;});
                document.addEventListener('mouseleave', function(){mouseX = -1000; mouseY = -1000;});
                requestAnimationFrame(illuminate);
            })();
        </script>
    </body>
</html>
