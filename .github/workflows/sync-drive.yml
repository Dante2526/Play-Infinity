name: Sincronizar Repo com Google Drive

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite rodar manualmente pelo botão no GitHub

jobs:
  sync-to-drive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Consolidar repositório com Repomix
        run: npx --yes repomix@latest --output repo-context.txt

      - name: Enviar arquivo consolidado para o Google Drive
        env:
          WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL }}
          SECRET_TOKEN: ${{ secrets.GDRIVE_SECRET_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          jq -n \
            --arg token "$SECRET_TOKEN" \
            --arg repoName "$REPO_NAME" \
            --rawfile content repo-context.txt \
            '{token: $token, repoName: $repoName, content: $content}' \
            > payload.json

          curl -s -L \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "$WEBHOOK_URL"
