name: Deploy Automático para Oracle VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      upgrade_node24:
        description: 'Manutenção: atualizar o Node do daemon da aplicação para 24 LTS (interrupção breve)'
        required: false
        default: false
        type: boolean
      migrate_legacy_fork:
        description: 'Manutenção única: migrar uma instância fork para cluster (interrompe o app brevemente)'
        required: false
        default: false
        type: boolean

concurrency:
  group: oracle-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    name: Build e Deploy no Play Infinity (Oracle VPS)

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm ci --no-audit --no-fund

      - name: Validar tipos, pagamentos e reprodução
        run: |
          npm run lint
          node --test tests/payments.test.cjs tests/mixdrop.test.cjs tests/mixdrop-routing.test.cjs tests/streamtape.test.cjs tests/streamtape-resolver.test.cjs tests/streamtape-sources.test.cjs tests/playback-health.test.cjs tests/home-releases.test.cjs tests/catalog-search.test.cjs tests/vizer.test.cjs
          node --test tests/deploy-deps.test.cjs tests/public-frontend.test.cjs

      - name: Validar troca de versão com conexão ativa
        run: |
          npm install --prefix "$RUNNER_TEMP/pm2-tests" --no-save --package-lock=false --no-audit --no-fund pm2@6.0.14
          PM2_BIN="$RUNNER_TEMP/pm2-tests/node_modules/.bin/pm2" node --test tests/deploy.test.cjs

      - name: Validar manutenção do runtime Node
        run: |
          PM2_BIN="$RUNNER_TEMP/pm2-tests/node_modules/.bin/pm2" node --test tests/node-upgrade.test.cjs

      - name: 🔨 Compilar Aplicação (Vite Build)
        run: npm run build

      - name: 📦 Compactar arquivos de Deploy
        run: |
          tar -czf /tmp/deploy-payload.tar.gz dist server.ts server package.json package-lock.json scripts data/encontrei-catalog.json ecosystem.config.cjs

      - name: 🔑 Configurar Chave SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          cp ~/.ssh/oracle_key ~/.ssh/id_ed25519
          cp ~/.ssh/oracle_key ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.ORACLE_HOST || '147.15.57.146' }} >> ~/.ssh/known_hosts || true

      - name: 🚀 Enviar Payload e Atualizar VPS
        env:
          # Explicit one-time maintenance, either manually selected or approved
          # as a commit bearing this prefix. Ordinary pushes never migrate fork.
          MIGRATE_LEGACY_FORK: ${{ (inputs.migrate_legacy_fork || startsWith(github.event.head_commit.message, '[migrate-legacy-fork] ')) && '1' || '0' }}
          UPGRADE_NODE24: ${{ (inputs.upgrade_node24 || startsWith(github.event.head_commit.message, '[upgrade-node24] ')) && '1' || '0' }}
        run: |
          HOST="${{ secrets.ORACLE_HOST || '147.15.57.146' }}"
          USER="${{ secrets.ORACLE_USER || 'ubuntu' }}"
          # npm ci can remain silent for minutes. Keep the SSH transport active;
          # ConnectTimeout only covers connection establishment.
          SSH_OPTS=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -o TCPKeepAlive=yes -i "$HOME/.ssh/oracle_key")
          
          RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ $UPGRADE_NODE24 == 1 ]]; then
            ARCH=$(ssh "${SSH_OPTS[@]}" "${USER}@${HOST}" uname -m)
            case "$ARCH" in
              x86_64) NODE_ARCH=x64 ;;
              aarch64) NODE_ARCH=arm64 ;;
              *) echo 'Arquitetura de VPS não suportada para Node 24.' >&2; exit 1 ;;
            esac
            NODE_VERSION=24.22.1
            NODE_FILE="node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.xz"
            curl --fail --location --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/${NODE_FILE}" -o "/tmp/${NODE_FILE}"
            curl --fail --location --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt" -o /tmp/node-shasums.txt
            NODE_SHA=$(awk -v file="$NODE_FILE" '$2 == file {print $1}' /tmp/node-shasums.txt)
            [[ $NODE_SHA =~ ^[a-f0-9]{64}$ ]]
            printf '%s  %s\n' "$NODE_SHA" "/tmp/$NODE_FILE" | sha256sum -c -
            scp "${SSH_OPTS[@]}" "/tmp/$NODE_FILE" "${USER}@${HOST}:/tmp/${NODE_FILE}"
            scp "${SSH_OPTS[@]}" scripts/upgrade-node24.sh "${USER}@${HOST}:/tmp/play-infinity-node-${RELEASE_ID}.sh"
            ssh "${SSH_OPTS[@]}" "${USER}@${HOST}" "sudo env PLAY_INFINITY_UPGRADE_NODE24=1 bash /tmp/play-infinity-node-${RELEASE_ID}.sh /tmp/${NODE_FILE} ${NODE_SHA} ${NODE_VERSION} /home/ubuntu/play-infinity"
          fi
          scp "${SSH_OPTS[@]}" /tmp/deploy-payload.tar.gz "${USER}@${HOST}:/tmp/play-infinity-${RELEASE_ID}.tar.gz"
          scp "${SSH_OPTS[@]}" scripts/deploy-release.sh "${USER}@${HOST}:/tmp/play-infinity-deploy-${RELEASE_ID}.sh"
          if ssh "${SSH_OPTS[@]}" "${USER}@${HOST}" "sudo env PLAY_INFINITY_PUBLIC_URL=https://play-infinity.stream PLAY_INFINITY_MIGRATE_LEGACY_FORK=${MIGRATE_LEGACY_FORK} bash /tmp/play-infinity-deploy-${RELEASE_ID}.sh /tmp/play-infinity-${RELEASE_ID}.tar.gz ${RELEASE_ID} /home/ubuntu/play-infinity"; then
            echo "Deploy remoto concluído e verificado: ${RELEASE_ID}"
          else
            SSH_STATUS=$?
            if [[ $SSH_STATUS == 255 ]]; then
              echo '::error::Conexão SSH perdida. O resultado remoto é desconhecido; confira PM2 e o healthcheck antes de repetir. Não houve confirmação de deploy nem de rollback.'
            fi
            exit "$SSH_STATUS"
          fi
