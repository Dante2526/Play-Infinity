name: Deploy Automático para Oracle VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      migrate_legacy_fork:
        description: 'Manutenção única: migrar uma instância fork para cluster (interrompe o app brevemente)'
        required: false
        default: false
        type: boolean

concurrency:
  group: oracle-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    name: Build e Deploy no Play Infinity (Oracle VPS)

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm ci --no-audit --no-fund

      - name: Validar tipos, pagamentos e reprodução
        run: |
          npm run lint
          node --test tests/payments.test.cjs tests/mixdrop.test.cjs tests/streamtape.test.cjs tests/playback-health.test.cjs tests/home-releases.test.cjs

      - name: Validar troca de versão com conexão ativa
        run: |
          npm install --prefix "$RUNNER_TEMP/pm2-tests" --no-save --package-lock=false --no-audit --no-fund pm2@6.0.14
          PM2_BIN="$RUNNER_TEMP/pm2-tests/node_modules/.bin/pm2" node --test tests/deploy.test.cjs

      - name: 🔨 Compilar Aplicação (Vite Build)
        run: npm run build

      - name: 📦 Compactar arquivos de Deploy
        run: |
          tar -czf /tmp/deploy-payload.tar.gz dist server.ts server package.json package-lock.json scripts data/encontrei-catalog.json ecosystem.config.cjs

      - name: 🔑 Configurar Chave SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          cp ~/.ssh/oracle_key ~/.ssh/id_ed25519
          cp ~/.ssh/oracle_key ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.ORACLE_HOST || '147.15.57.146' }} >> ~/.ssh/known_hosts || true

      - name: 🚀 Enviar Payload e Atualizar VPS
        env:
          # Explicit one-time maintenance, either manually selected or approved
          # as a commit bearing this prefix. Ordinary pushes never migrate fork.
          MIGRATE_LEGACY_FORK: ${{ (inputs.migrate_legacy_fork || startsWith(github.event.head_commit.message, '[migrate-legacy-fork] ')) && '1' || '0' }}
        run: |
          HOST="${{ secrets.ORACLE_HOST || '147.15.57.146' }}"
          USER="${{ secrets.ORACLE_USER || 'ubuntu' }}"
          # npm ci can remain silent for minutes. Keep the SSH transport active;
          # ConnectTimeout only covers connection establishment.
          SSH_OPTS=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -o TCPKeepAlive=yes -i "$HOME/.ssh/oracle_key")
          
          RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          scp "${SSH_OPTS[@]}" /tmp/deploy-payload.tar.gz "${USER}@${HOST}:/tmp/play-infinity-${RELEASE_ID}.tar.gz"
          scp "${SSH_OPTS[@]}" scripts/deploy-release.sh "${USER}@${HOST}:/tmp/play-infinity-deploy-${RELEASE_ID}.sh"
          if ssh "${SSH_OPTS[@]}" "${USER}@${HOST}" "sudo env PLAY_INFINITY_MIGRATE_LEGACY_FORK=${MIGRATE_LEGACY_FORK} bash /tmp/play-infinity-deploy-${RELEASE_ID}.sh /tmp/play-infinity-${RELEASE_ID}.tar.gz ${RELEASE_ID} /home/ubuntu/play-infinity"; then
            echo "Deploy remoto concluído e verificado: ${RELEASE_ID}"
          else
            SSH_STATUS=$?
            if [[ $SSH_STATUS == 255 ]]; then
              echo '::error::Conexão SSH perdida. O resultado remoto é desconhecido; confira PM2 e o healthcheck antes de repetir. Não houve confirmação de deploy nem de rollback.'
            fi
            exit "$SSH_STATUS"
          fi
