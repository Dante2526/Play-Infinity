<!doctype html>
<html lang="pt-BR" translate="no" class="notranslate bg-[#0a0a0a]">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Play Infinity</title>
    <meta name="description" content="Um aplicativo de streaming responsivo para filmes, séries e TV ao vivo com esportes, tema escuro e detalhes em laranja." />
    <meta property="og:title" content="Play Infinity" />
    <meta property="og:description" content="Um aplicativo de streaming responsivo para filmes, séries e TV ao vivo com esportes, tema escuro e detalhes em laranja." />
    <script>
      (function() {
        // Polyfill globalThis para browsers antigos de TV
        if (typeof globalThis === 'undefined') {
          window.globalThis = window;
        }

        // Proteção contra SecurityError de localStorage em TVs
        try {
          var testKey = '__tv_test__';
          window.localStorage.setItem(testKey, '1');
          window.localStorage.removeItem(testKey);
        } catch (e) {
          var mem = {};
          window.localStorage = {
            getItem: function(k) { return mem[k] || null; },
            setItem: function(k, v) { mem[k] = String(v); },
            removeItem: function(k) { delete mem[k]; },
            clear: function() { mem = {}; }
          };
        }

        // Detecção precoce de Smart TV
        try {
          var ua = (navigator.userAgent || '').toLowerCase();
          var isTV = /smarttv|tizen|webos|bravia|android tv|aftt|afts|aftm|vidaa|hisense|philips|panasonic|roku|crkey|googletv/i.test(ua) ||
                     (navigator.platform && navigator.platform.toLowerCase().indexOf('tv') !== -1);
          if (isTV) {
            document.documentElement.classList.add('is-smart-tv');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#0a0a0a] text-white min-h-screen overflow-x-hidden w-full max-w-[100vw] m-0 p-0">
    <div id="root" class="bg-[#0a0a0a] min-h-screen overflow-x-hidden w-full max-w-[100vw]"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
