}

  transform: translateX(4px);
  box-shadow: 0 4px 16px rgba(229, 9, 20, 0.1);
}

  transform: scaleY(1);
}

.option:active, .episode:active {
  transform: scale(0.97);
}

/* Ícone */
.option > div:first-child {
  width: 46px;

  background: rgba(229, 9, 20, 0.1);

  height: 100%;

}

  transform: scale(1.05);

}

.option > div:nth-child(2) {

}

.option > div:nth-child(2) > div:last-child {
  display: flex;
  gap: 8px;
  align-items: center;
}
