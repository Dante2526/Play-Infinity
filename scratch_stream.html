        <script>
          (function() {
            // 1. MutationObserver ativo que remove instantaneamente qualquer elemento residual
            var observer = new MutationObserver(function(mutations) {
              for (var i = 0; i < mutations.length; i++) {
                var added = mutations[i].addedNodes;
                for (var j = 0; j < added.length; j++) {
                  var node = added[j];
                  if (node.nodeType === 1) {
                    var cls = (node.className || '');
                    if (typeof cls === 'string' && (
                      cls.indexOf('art-state') !== -1 ||
                      cls.indexOf('art-bottom') !== -1 ||
                      cls.indexOf('art-mask') !== -1 ||
                      cls.indexOf('art-controls') !== -1 ||
                      cls.indexOf('art-notice') !== -1 ||
                      cls.indexOf('art-loading') !== -1 ||
                      cls.indexOf('player_loading') !== -1 ||
                      cls.indexOf('shion_native') !== -1
                    )) {
                      node.style.setProperty('display', 'none', 'important');
                      node.style.setProperty('opacity', '0', 'important');
                      node.style.setProperty('visibility', 'hidden', 'important');
                      try { node.remove(); } catch(e) {}
                    }
                  }
                }
              }
            });
            observer.observe(document.documentElement, { childList: true, subtree: true });

            // 2. Auto-Start rápido na primeira opção disponível
            var tries = 0;
            var autoStartTimer = setInterval(function() {
              tries++;
              var dublado = document.querySelector('.select_language[data-target="1"]');
              if (dublado && !dublado.classList.contains('active')) {
                dublado.click();
              }
              var option = document.querySelector('.players_select_items.visible .player_select_item') || 
                           document.querySelector('.player_select_item');
              if (option) {
                option.click();
                clearInterval(autoStartTimer);
              }
              if (tries > 80) {
                clearInterval(autoStartTimer);
              }
            }, 30);

            // 3. Funções de controle de vídeo e telemetria para o NetflixPlayerSkin
            var introSkippedForCurrentVideo = false;
            var skipDurationSeconds = 85;
            try {
              skipDurationSeconds = parseInt(localStorage.getItem("playinfinity_skip_duration") || "85", 10);
            } catch(e) {}

            function getVideoElement() {
              if (window.artInstance && window.artInstance.video) {
                return window.artInstance.video;
              }
              return document.querySelector("video");
            }

            function doSkipIntro(seconds) {
              var sec = Number(seconds) !== undefined && !isNaN(Number(seconds)) ? Number(seconds) : (skipDurationSeconds || 85);
              var video = getVideoElement();
              if (video) {
                var current = video.currentTime || 0;
                var duration = video.duration || 3600;
                var targetTime = Math.max(0, Math.min(current + sec, duration - 10));
                
                try {
                  video.currentTime = targetTime;
                } catch(e) {}

                if (window.artInstance) {
                  try {
                    window.artInstance.currentTime = targetTime;
                  } catch(e) {}
                }

                if (sec > 0) {
                  introSkippedForCurrentVideo = true;
                }

                try {
                  window.parent.postMessage({ 
                    type: "WATCHPLAY_INTRO_SKIPPED", 
                    seconds: sec, 
                    newTime: targetTime 
                  }, "*");
                } catch(e) {}
              }
            }

            // Tecla S manual
            window.addEventListener("keydown", function(e) {
              if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
              if (e.key === "s" || e.key === "S") {
                e.preventDefault();
                doSkipIntro(skipDurationSeconds);
              }
            });

            // Mensagens enviadas pela Skin Netflix VIP
            window.addEventListener("message", function(e) {
              if (!e.data) return;
              var v = getVideoElement();

              switch (e.data.type) {
                case "SKIP_INTRO":
                  doSkipIntro(e.data.seconds || skipDurationSeconds);
                  break;

                case "PLAY":
                  if (v) {
                    v.play().catch(function() {});
                    sendPlayerStatus(v);
                  }
                  break;

                case "PAUSE":
                  if (v) {
                    v.pause();
                    sendPlayerStatus(v);
                  }
                  break;

                case "TOGGLE_PLAY":
                  if (v) {
                    if (v.paused) {
                      v.play().catch(function() {});
                    } else {
                      v.pause();
                    }
                    sendPlayerStatus(v);
                  }
                  break;

                case "SEEK":
                case "SEEK_ABSOLUTE":
                  var t = typeof e.data.time === "number" ? e.data.time : e.data.targetTime;
                  if (v && typeof t === "number" && !isNaN(t)) {
                    var maxDur = v.duration && v.duration > 0 ? v.duration : 99999;
                    v.currentTime = Math.max(0, Math.min(t, maxDur - 0.5));
                    sendPlayerStatus(v);
                  }
                  break;

                case "SEEK_RELATIVE":
                  if (v && typeof e.data.seconds === "number" && !isNaN(e.data.seconds)) {
                    var curT = v.currentTime || 0;
                    var maxD = v.duration && v.duration > 0 ? v.duration : 99999;
                    v.currentTime = Math.max(0, Math.min(curT + e.data.seconds, maxD - 0.5));
                    sendPlayerStatus(v);
                  }
                  break;

                case "SET_VOLUME":
                  if (v && typeof e.data.volume === "number") {
                    var vol = Math.max(0, Math.min(1, e.data.volume));
                    v.volume = vol;
                    v.muted = (vol === 0);
                    sendPlayerStatus(v);
                  }
                  break;

                case "SET_MUTED":
                  if (v) {
                    v.muted = !!e.data.muted;
                    sendPlayerStatus(v);
                  }
                  break;

                case "SET_PLAYBACK_RATE":
                  if (v && typeof e.data.rate === "number") {
                    v.playbackRate = e.data.rate;
                    sendPlayerStatus(v);
                  }
                  break;

                case "SET_SKIP_DURATION":
                  if (e.data.seconds) {
                    skipDurationSeconds = Number(e.data.seconds);
                    try {
                      localStorage.setItem("playinfinity_skip_duration", String(skipDurationSeconds));
                    } catch(err) {}
                  }
                  break;

                case "REQUEST_STATUS":
                  sendPlayerStatus(v);
                  break;
              }
            });

            // Envia telemetria limpa para a Skin Netflix do aplicativo principal
            function sendPlayerStatus(v) {
              if (!v) v = getVideoElement();
              if (!v) return;
              try {
                var bufferedEnd = 0;
                if (v.buffered && v.buffered.length > 0) {
                  bufferedEnd = v.buffered.end(v.buffered.length - 1);
                }
                window.parent.postMessage({
                  type: "WATCHPLAY_STATUS",
                  currentTime: v.currentTime || 0,
                  duration: v.duration || 0,
                  paused: !!v.paused,
                  muted: !!v.muted,
                  volume: typeof v.volume === "number" ? v.volume : 1,
                  buffered: bufferedEnd,
                  playbackRate: v.playbackRate || 1,
                  readyState: v.readyState || 0
                }, "*");
              } catch(e) {}
            }

            var hasNotifiedEnded = false;
            function notifyEpisodeEnded() {
              if (hasNotifiedEnded) return;
              hasNotifiedEnded = true;
              try {
                window.parent.postMessage({ type: "WATCHPLAY_VIDEO_ENDED" }, "*");
              } catch(e) {}
            }

            document.addEventListener('ended', function(e) {
              if (e.target && (e.target.tagName === 'VIDEO' || e.target.nodeName === 'VIDEO')) {
                notifyEpisodeEnded();
              }
            }, true);

            function handleVideoTimeUpdate(v) {
              if (!v) return;
              var cur = v.currentTime || 0;
              var dur = v.duration || 0;

              if (cur < 2 && introSkippedForCurrentVideo) {
                introSkippedForCurrentVideo = false;
              }

              if (cur >= 5 && cur <= 130 && !introSkippedForCurrentVideo) {
                try {
                  window.parent.postMessage({ type: "WATCHPLAY_INTRO_ACTIVE", active: true, currentTime: cur }, "*");
                } catch(e) {}
              } else {
                try {
                  window.parent.postMessage({ type: "WATCHPLAY_INTRO_ACTIVE", active: false, currentTime: cur }, "*");
                } catch(e) {}
              }

              if (dur > 30 && cur >= (dur - 1.5)) {
                notifyEpisodeEnded();
              }

              sendPlayerStatus(v);
            }

            setInterval(function() {
              var v = getVideoElement();
              if (v) {
                sendPlayerStatus(v);
                if (!v.paused) {
                  handleVideoTimeUpdate(v);
                }
              }
            }, 350);

            ['play', 'pause', 'playing', 'seeking', 'seeked', 'volumechange', 'ratechange', 'loadedmetadata', 'canplay'].forEach(function(evtName) {
              document.addEventListener(evtName, function(e) {
                if (e.target && (e.target.tagName === 'VIDEO' || e.target.nodeName === 'VIDEO')) {
                  sendPlayerStatus(e.target);
                }
              }, true);
            });

            // Blindagem total do Artplayer: desativa qualquer tentativa de exibir controles ou máscara
            var cleanArtNodes = function() {
              if (window.artInstance) {
                try {
                  if (window.artInstance.controls) window.artInstance.controls.show = false;
                  if (window.artInstance.mask) window.artInstance.mask.show = false;
                } catch(e) {}
                if (window.artInstance.template) {
                  ['$state', '$bottom', '$mask', '$top', '$notice', '$loading', '$controls'].forEach(function(k) {
                    try {
                      if (window.artInstance.template[k] && window.artInstance.template[k].remove) {
                        window.artInstance.template[k].remove();
                      }
                    } catch(e) {}
                  });
                }
              }
            };

            var artCheckInterval = setInterval(function() {
              if (window.artInstance) {
                cleanArtNodes();
                if (!window.artInstance._endedHooked) {
                  window.artInstance._endedHooked = true;
                  cleanArtNodes();
                  window.artInstance.on('ready', cleanArtNodes);
                  window.artInstance.on('video:play', cleanArtNodes);
                  window.artInstance.on('video:pause', cleanArtNodes);
                  window.artInstance.on('video:ended', notifyEpisodeEnded);
                  window.artInstance.on('video:timeupdate', function() {
                    var v = window.artInstance.video;
                    if (v) handleVideoTimeUpdate(v);
                  });
                }
              }
            }, 300);
          })();
        </script>

<script src="https://v1.watchplay.shop/js/rteam_native_notify.js?v=1.0"></script>
<script>
// Select Option
$('.select_language').on('click', function() {
    let target = $(this).data('target');

    if ( !$(this).hasClass('active') ) {
        $('.select_language').removeClass('active');
        $(this).addClass('active');

        $('.players_select_items').removeClass('visible');
        $('.players_select_items[data-target="'+target+'"]').addClass('visible');
    }
});

// Select Video
$('.player_select_item').on('click', function(){
    /* player_loading bloqueado */
    let video_id = $(this).data('id');
    
    $.ajax({
        url: `/api/watchplay-proxy-api`,
        method: 'POST',
        data: {
            action  : 'getPlayer',
            video_id
        },
        success: function(msg) {
            $('.player_loading').remove();
            $('.players_select_container').addClass('hidden');
            $('.player_container').addClass('visible');

            var rawVideoUrl = msg.data.video_url;

            // Assina a URL com MD5 se for do seu servidor HLS e não contiver o token
            if (rawVideoUrl.includes('vid7102402.hclod.qzz.io') && !rawVideoUrl.includes('md5=')) {
                $.ajax({
                    url: window.location.href,
                    method: 'GET',
                    data: {
                        action_secure_sign: 1,
                        raw_url: rawVideoUrl
                    },
                    success: function(secureRes) {
                        loadArtPlayer(secureRes.signed_url, msg.data.video_caption_url);
                    },
                    error: function() {
                        loadArtPlayer(rawVideoUrl, msg.data.video_caption_url);
                    }
                });
            } else {
                loadArtPlayer(rawVideoUrl, msg.data.video_caption_url);
            }
        },
        error: function(msg) {
            $('.player_loading').remove();
            if ( msg.responseJSON && "data" in msg.responseJSON ) {
                produce_native_notify(msg.responseJSON.data.errors, 'error');
            } else {
                produce_native_notify('Houve um erro inesperado.', 'error');
            }
        }
    });
});

// Interceptador Tela Cheia Mobile
$(document).on('click touchstart', '[data-fullscreen]', function(e) {
    var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    if (isMobile) {
        var video = document.querySelector('video');
        if (video) {
            if (video.webkitEnterFullscreen) {
                video.webkitEnterFullscreen();
                e.preventDefault();
                e.stopPropagation();
            } else if (video.requestFullscreen) {
                video.requestFullscreen();
                e.preventDefault();
                e.stopPropagation();
            }
        }
    }
});

// Auto-play
$(window).on('load', function() {
    if (AUTO_PLAY_ENABLED) {
        setTimeout(function() {
            var $firstItem = $('.players_select_items.visible .player_select_item').first();
            
            if (!$firstItem.length) {
                $firstItem = $('.player_select_item').first();
            }

            if ($firstItem.length) {
                $firstItem.click();
            }
        }, 100);
    }
});

// Change Options
$('.changeOptions').on('click', function(){
    $('.players_select_container').removeClass('hidden');
    $('.player_container').removeClass('visible');
    setTimeout(() => {
        if (artInstance) {
            artInstance.destroy(true);
            artInstance = null;
        }
        $('.player_container .infra').html('');
    }, 300);
});

// Banner
$(document).ready(function() {
    if ( $('.embedder_especial').length > 0 ) {
        $('.embedder_especial').css({'display': 'flex'});
    }
});

$(document).on('click', '.embedder_especial_close', function() {
    $('.embedder_especial').hide();
});

// Embedder Info
$(document).on('click', '.embedder_info', function() {
    $('body').append(`
        <div class="embedder_especial embedder_info_msg" style="display: flex">
            <div class="embedder_especial_content" style="padding: 30px 20px;">
                <div class="embedder_especial_close2"><i class="ri-close-line"></i></div>
                Acesse watchplayer.net            </div>
        </div>
    `);
});

$(document).on('click', '.embedder_especial_close2', function() {
    $('.embedder_especial.embedder_info_msg').remove();
});
</script>
